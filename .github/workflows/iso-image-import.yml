name: Import ISO exact card fronts (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Explain fallback status
        run: |
          echo "ISO importer is retained only as a manual diagnostic fallback."
          echo "The production bulk cache is owned by catalog-sync.yml so an unavailable ISO archive cannot overwrite verified TCDB/eBay results."
