name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate frontend JavaScript
        run: |
          node --check app-v05.js
          node --check app-v06-addon.js
          node --check app-v06-polish.js
          node --check app-v06-fix.js
          node --check app-v08-image-guard.js
          node --check app-v08-catalog.js
          node --check pricing-engine.js
          node --check market-seed.js
          node --check catalog-owned.js
          node --check catalog-owned-batch2.js
          node --check catalog-images.js
          node --check catalog-images-official.js
          node --check catalog-images-cached.js
          node --check catalog-runtime.js
      - name: Verify required V0.8 assets
        run: |
          test -f v06.css
          test -f v06-polish.css
          test -f v07.css
          test -f catalog-premier.js
          test -f catalog-images-cached.js
          test -f catalog-owned.js
          test -f catalog-owned-batch2.js
          test -f app-v08-image-guard.js
          test -f app-v08-catalog.js
          test -f market-seed.js
          test -f pricing-engine.js
          grep -q 'catalog-owned.js' index.html
          grep -q 'catalog-owned-batch2.js' index.html
          grep -q 'app-v08-image-guard.js' index.html
          grep -q 'app-v08-catalog.js' index.html
          grep -q 'pricing-engine.js' index.html
          grep -q 'v07.css' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
