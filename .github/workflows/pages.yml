name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "sw.js"
      - "*.js"
      - "*.css"
      - "*.webmanifest"
      - "*.svg"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate frontend JavaScript
        run: |
          node --check app-v05.js
          node --check app-v06-addon.js
          node --check app-v06-polish.js
          node --check app-v06-fix.js
          node --check app-v08-image-guard.js
          node --check app-v08-catalog.js
          node --check app-v10-autocomplete.js
          node --check app-v11-home-search.js
          node --check app-v11-now-ui.js
          node --check app-v11-catalog-normalize.js
          node --check pricing-engine.js
          node --check market-seed.js
          node --check catalog-owned.js
          node --check catalog-intl-expanded.js
          node --check catalog-teamsets-expanded.js
          node --check catalog-select-laliga-expanded.js
          node --check catalog-select-laliga-inserts.js
          node --check catalog-prizm-cwc-expanded.js
          node --check catalog-prizm-cwc-inserts.js
          node --check catalog-prizm-monopoly-wc-expanded.js
          node --check catalog-select-road-wc-expanded.js
          node --check catalog-select-road-wc-inserts.js
          node --check catalog-halloflists-expanded.js
          node --check catalog-now-halloflists.js
          node --check catalog-checklistinsider-expanded.js
          node --check catalog-fc-tins-expanded.js
          node --check catalog-owned-batch2.js
          node --check catalog-owned-batch3.js
          node --check catalog-mycardfolio-expanded.js
          node --check catalog-images-mycardfolio.js
          node --check catalog-images-ebay.js
          node --check catalog-images.js
          node --check catalog-images-official.js
          node --check catalog-images-teamsets.js
          node --check catalog-images-cached.js
          node --check catalog-runtime.js
          node --check card-visuals.js
      - name: Verify required app assets
        run: |
          for f in v06.css v06-polish.css v07.css catalog-premier.js catalog-intl-expanded.js catalog-teamsets-expanded.js catalog-select-laliga-expanded.js catalog-select-laliga-inserts.js catalog-prizm-cwc-expanded.js catalog-prizm-cwc-inserts.js catalog-prizm-monopoly-wc-expanded.js catalog-select-road-wc-expanded.js catalog-select-road-wc-inserts.js catalog-halloflists-expanded.js catalog-now-halloflists.js catalog-checklistinsider-expanded.js catalog-fc-tins-expanded.js app-v11-catalog-normalize.js catalog-images-cached.js catalog-images-teamsets.js catalog-owned.js catalog-owned-batch2.js catalog-owned-batch3.js app-v08-image-guard.js app-v08-catalog.js market-seed.js pricing-engine.js; do test -f "$f"; done
          grep -q 'catalog-halloflists-expanded.js' index.html
          grep -q 'catalog-now-halloflists.js' index.html
          grep -q 'catalog-checklistinsider-expanded.js' index.html
          grep -q 'catalog-fc-tins-expanded.js' index.html
          grep -q 'catalog-mycardfolio-expanded.js' index.html
          grep -q 'catalog-images-mycardfolio.js' index.html
          grep -q 'app-v11-home-search.js' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
