name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate frontend JavaScript
        run: |
          node --check app-v05.js
          node --check app-v06-addon.js
          node --check catalog-images.js
          node --check catalog-images-official.js
          node --check catalog-runtime.js
      - name: Verify required V0.6 assets
        run: |
          test -f v06.css
          test -f catalog-premier.js
          grep -q 'app-v06-addon.js' index.html
          grep -q 'catalog-images.js' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
