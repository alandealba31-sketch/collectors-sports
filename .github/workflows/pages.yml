name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate frontend JavaScript
        run: |
          node --check app-v05.js
          node --check app-v06-addon.js
          node --check app-v06-polish.js
          node --check app-v06-fix.js
          node --check app-v08-image-guard.js
          node --check app-v08-catalog.js
          node --check app-v10-autocomplete.js
          node --check app-v11-home-search.js
          node --check app-v11-now-ui.js
          node --check app-v11-catalog-normalize.js
          node --check pricing-engine.js
          node --check market-seed.js
          node --check catalog-owned.js
          node --check catalog-intl-expanded.js
          node --check catalog-teamsets-expanded.js
          node --check catalog-select-laliga-expanded.js
          node --check catalog-select-laliga-inserts.js
          node --check catalog-prizm-cwc-expanded.js
          node --check catalog-prizm-cwc-inserts.js
          node --check catalog-prizm-monopoly-wc-expanded.js
          node --check catalog-select-road-wc-expanded.js
          node --check catalog-select-road-wc-inserts.js
          node --check catalog-halloflists-expanded.js
          node --check catalog-owned-batch2.js
          node --check catalog-owned-batch3.js
          node --check catalog-mycardfolio-expanded.js
          node --check catalog-images-mycardfolio.js
          node --check catalog-images-ebay.js
          node --check catalog-images.js
          node --check catalog-images-official.js
          node --check catalog-images-teamsets.js
          node --check catalog-images-cached.js
          node --check catalog-runtime.js
      - name: Verify required app assets
        run: |
          test -f v06.css
          test -f v06-polish.css
          test -f v07.css
          test -f catalog-premier.js
          test -f catalog-intl-expanded.js
          test -f catalog-teamsets-expanded.js
          test -f catalog-select-laliga-expanded.js
          test -f catalog-select-laliga-inserts.js
          test -f catalog-prizm-cwc-expanded.js
          test -f catalog-prizm-cwc-inserts.js
          test -f catalog-prizm-monopoly-wc-expanded.js
          test -f catalog-select-road-wc-expanded.js
          test -f catalog-select-road-wc-inserts.js
          test -f catalog-halloflists-expanded.js
          test -f app-v11-catalog-normalize.js
          test -f catalog-images-cached.js
          test -f catalog-images-teamsets.js
          test -f catalog-owned.js
          test -f catalog-owned-batch2.js
          test -f catalog-owned-batch3.js
          test -f app-v08-image-guard.js
          test -f app-v08-catalog.js
          test -f market-seed.js
          test -f pricing-engine.js
          grep -q 'catalog-intl-expanded.js' index.html
          grep -q 'catalog-teamsets-expanded.js' index.html
          grep -q 'catalog-select-laliga-expanded.js' index.html
          grep -q 'catalog-select-laliga-inserts.js' index.html
          grep -q 'catalog-prizm-cwc-expanded.js' index.html
          grep -q 'catalog-prizm-cwc-inserts.js' index.html
          grep -q 'catalog-prizm-monopoly-wc-expanded.js' index.html
          grep -q 'catalog-select-road-wc-expanded.js' index.html
          grep -q 'catalog-select-road-wc-inserts.js' index.html
          grep -q 'catalog-halloflists-expanded.js' index.html
          grep -q 'app-v11-catalog-normalize.js' index.html
          grep -q 'catalog-mycardfolio-expanded.js' index.html
          grep -q 'catalog-images-mycardfolio.js' index.html
          grep -q 'app-v11-home-search.js' index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
