name: Sync official card checklists

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/workflows/catalog-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "catalog-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check pandas xlrd pypdf
      - name: Build catalog from official checklists
        run: python tools/sync_checklists.py
      - name: Commit generated catalog when changed
        run: |
          if git diff --quiet -- catalog-imported.js; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-imported.js
          git commit -m "Sync official card checklists"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; retrying ($attempt/3)..."
            sleep 2
          done
          exit 1
