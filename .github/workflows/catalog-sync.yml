name: Sync official card checklists

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - ".github/workflows/catalog-sync.yml"
  workflow_dispatch:
  schedule:
    # Refresh official checklists and verified image galleries every day.
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: "catalog-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check pandas xlrd pypdf pillow
      - name: Build catalog from official checklists and galleries
        run: |
          set -euo pipefail
          python tools/sync_checklists.py
          python tools/sync_premier.py
          python tools/sync_official_images.py
          python tools/cache_exact_images.py
      - name: Validate catalog integrity
        run: python tools/validate_catalog.py
      - name: Validate generated JavaScript
        run: |
          node --check catalog-imported.js
          node --check catalog-premier.js
          node --check catalog-images-official.js
          node --check catalog-images-cached.js
      - name: Commit generated catalog when changed
        run: |
          if [ -z "$(git status --porcelain -- catalog-imported.js catalog-premier.js catalog-images-official.js catalog-images-cached.js)" ]; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog-imported.js catalog-premier.js catalog-images-official.js catalog-images-cached.js
          git commit -m "Sync official card catalog and visual galleries"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push race detected; retrying ($attempt/3)..."
            sleep 2
          done
          exit 1
