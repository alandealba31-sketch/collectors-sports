name: Sync card catalog and exact fronts at scale

on:
  push:
    branches: ["main"]
    paths:
      - "data/catalog-sync-trigger.txt"
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: "catalog-sync"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      IMAGE_IMPORT_MAX_NEW: "2500"
      IMAGE_IMPORT_DELAY: "0.20"
      ISO_IMAGE_IMPORT_DELAY: "0.45"
      EBAY_IMPORT_MAX_NEW: "1000"
      EBAY_IMPORT_DELAY: "0.10"
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install parser and MCP dependencies
        run: python -m pip install --disable-pip-version-check pandas xlrd pypdf pillow requests beautifulsoup4 mcp
      - name: Build catalog from official manufacturer checklists
        run: |
          set -euo pipefail
          python tools/sync_checklists.py
          python tools/sync_premier.py
          python tools/sync_official_images.py
          python tools/cache_exact_images.py
      - name: Import large published checklist pages without blocking the pipeline
        run: |
          set +e
          run_optional() {
            label="$1"
            shift
            echo "::group::$label"
            "$@"
            code=$?
            if [ $code -ne 0 ]; then
              echo "::warning::$label failed with exit code $code; preserving other catalog work and continuing."
            fi
            echo "::endgroup::"
            return 0
          }
          run_optional "Hall of Lists" python tools/sync_halloflists.py
          run_optional "Hall of Lists NOW" python tools/sync_halloflists_now.py
          run_optional "ChecklistInsider" python tools/sync_checklistinsider.py
          run_optional "FC Collector Tins" python tools/sync_fc_collector_tins.py
          run_optional "Owned priority sources" python tools/sync_owned_priority_sources.py
      - name: Expand products and exact fronts through exact-year structured MCP
        run: |
          python sync_mycardfolio_v3.py || echo "::warning::MyCardfolio sync failed; continuing with last valid generated data."
      - name: Validate official generated catalog
        run: python tools/validate_catalog.py
      - name: Export every searchable identity
        run: node tools/export_catalog_image_targets.mjs
      - name: Fill verified exact fronts from TCDB and ISO
        run: |
          python tools/import_tcdb_exact_images_v2.py || echo "::warning::TCDB exact-image import failed; continuing with existing exact fronts."
          python tools/import_iso_exact_images.py || echo "::warning::ISO exact-image import failed; continuing with existing exact fronts."
      - name: Fill remaining exact fronts through eBay Browse API
        run: |
          python tools/import_ebay_exact_images.py || echo "::warning::eBay exact-image import failed; continuing with existing exact fronts."
      - name: Audit loaded catalog and exact-front coverage
        run: node tools/audit_loaded_catalog.mjs
      - name: Clean runtime targets
        if: always()
        run: rm -f data/image-targets-runtime.json data/mycardfolio-runtime-products.json
      - name: Validate generated JavaScript
        run: |
          node --check catalog-imported.js
          node --check catalog-premier.js
          node --check catalog-halloflists-expanded.js
          node --check catalog-now-halloflists.js
          node --check catalog-checklistinsider-expanded.js
          node --check catalog-fc-tins-expanded.js
          node --check catalog-owned-priority-expanded.js
          node --check catalog-mycardfolio-expanded.js
          node --check catalog-images-mycardfolio.js
          node --check catalog-images-official.js
          node --check catalog-images-cached.js
          node --check catalog-images-bulk.js
          node --check catalog-images-ebay.js
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ['data/catalog-summary.json','data/halloflists-sync-report.json','data/halloflists-now-sync-report.json','data/checklistinsider-sync-report.json','data/fc-tins-sync-report.json','data/owned-priority-sync-report.json','data/mycardfolio-sync-report.json','data/bulk-image-report.json','data/ebay-image-report.json']:
              p=Path(filename)
              if p.exists():
                  print('\n'+filename)
                  print(json.dumps(json.loads(p.read_text()),indent=2)[:24000])
          PY
      - name: Commit generated catalog when changed
        run: |
          set -euo pipefail
          CANDIDATES=(
            catalog-imported.js catalog-premier.js catalog-halloflists-expanded.js catalog-now-halloflists.js catalog-checklistinsider-expanded.js catalog-fc-tins-expanded.js catalog-owned-priority-expanded.js catalog-mycardfolio-expanded.js
            catalog-images-mycardfolio.js catalog-images-official.js catalog-images-cached.js catalog-images-bulk.js catalog-images-ebay.js
            data/catalog-summary.json data/halloflists-sync-report.json data/halloflists-now-sync-report.json data/checklistinsider-sync-report.json data/fc-tins-sync-report.json data/owned-priority-sync-report.json data/mycardfolio-sync-state.json data/mycardfolio-sync-report.json
            data/bulk-image-manifest.json data/bulk-image-report.json assets/cards/bulk
            data/ebay-image-manifest.json data/ebay-image-report.json assets/cards/ebay
          )
          EXISTING=()
          for p in "${CANDIDATES[@]}"; do [ -e "$p" ] && EXISTING+=("$p"); done
          if [ ${#EXISTING[@]} -eq 0 ] || [ -z "$(git status --porcelain -- "${EXISTING[@]}")" ]; then echo "Catalog and exact-front caches are already current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${EXISTING[@]}"
          git commit -m "Sync structured catalog and bulk exact card fronts"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
