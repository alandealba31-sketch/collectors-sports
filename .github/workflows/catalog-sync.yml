name: Sync card catalog and exact fronts at scale

on:
  push:
    branches: ["main"]
    paths:
      - "tools/**"
      - "sync_mycardfolio_v2.py"
      - "sync_mycardfolio_v3.py"
      - "mycardfolio_product_sources_v2.json"
      - ".github/workflows/catalog-sync.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: write

concurrency:
  group: "catalog-sync"
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EBAY_IMPORT_MAX_NEW: "1000"
      EBAY_IMPORT_DELAY: "0.10"
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install parser and MCP dependencies
        run: python -m pip install --disable-pip-version-check pandas xlrd pypdf pillow requests beautifulsoup4 mcp

      - name: Build catalog from official manufacturer checklists
        run: |
          set -euo pipefail
          python tools/sync_checklists.py
          python tools/sync_premier.py
          python tools/sync_official_images.py
          python tools/cache_exact_images.py

      - name: Expand owned products and exact fronts through exact-year structured MCP
        run: python sync_mycardfolio_v3.py

      - name: Validate official generated catalog
        run: python tools/validate_catalog.py

      - name: Export every searchable identity
        run: node tools/export_catalog_image_targets.mjs

      - name: Fill remaining exact fronts through eBay Browse API
        run: python tools/import_ebay_exact_images.py

      - name: Clean runtime targets
        if: always()
        run: rm -f data/image-targets-runtime.json

      - name: Validate generated JavaScript
        run: |
          node --check catalog-imported.js
          node --check catalog-premier.js
          node --check catalog-mycardfolio-expanded.js
          node --check catalog-images-mycardfolio.js
          node --check catalog-images-official.js
          node --check catalog-images-cached.js
          node --check catalog-images-bulk.js
          node --check catalog-images-ebay.js
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ['data/mycardfolio-sync-report.json','data/ebay-image-report.json']:
              p=Path(filename)
              if p.exists():
                  print('\n'+filename)
                  print(json.dumps(json.loads(p.read_text()),indent=2)[:24000])
          PY

      - name: Commit generated catalog when changed
        run: |
          set -euo pipefail
          CANDIDATES=(
            catalog-imported.js catalog-premier.js catalog-mycardfolio-expanded.js
            catalog-images-mycardfolio.js catalog-images-official.js catalog-images-cached.js catalog-images-ebay.js
            data/mycardfolio-sync-state.json data/mycardfolio-sync-report.json
            data/ebay-image-manifest.json data/ebay-image-report.json assets/cards/ebay
          )
          EXISTING=()
          for p in "${CANDIDATES[@]}"; do
            [ -e "$p" ] && EXISTING+=("$p")
          done
          if [ ${#EXISTING[@]} -eq 0 ] || [ -z "$(git status --porcelain -- "${EXISTING[@]}")" ]; then
            echo "Catalog and exact-front caches are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${EXISTING[@]}"
          git commit -m "Sync structured catalog and bulk exact card fronts"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
