name: Sync exact card fronts fast

on:
  push:
    branches: ["main"]
    paths:
      - "data/image-sync-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "image-sync"
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      IMAGE_IMPORT_MAX_NEW: "5000"
      IMAGE_IMPORT_DELAY: "0.16"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Export image targets
        run: node tools/export_catalog_image_targets.mjs
      - name: Import verified exact fronts from TCDB
        run: python tools/import_tcdb_exact_images_v2.py
      - name: Audit image coverage
        run: |
          node tools/audit_loaded_catalog.mjs
          node tools/audit_owned_collection_gaps.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ['data/catalog-summary.json','data/owned-collection-gap-report.json','data/tcdb-image-report.json']:
              p=Path(filename)
              if p.exists():
                  print('\n'+filename)
                  print(json.dumps(json.loads(p.read_text()),indent=2)[:30000])
          PY
      - name: Clean runtime targets
        if: always()
        run: rm -f data/image-targets-runtime.json
      - name: Validate generated image catalog
        run: node --check catalog-images-bulk.js
      - name: Commit image gains
        run: |
          set -euo pipefail
          CANDIDATES=(catalog-images-bulk.js data/bulk-image-manifest.json data/tcdb-image-report.json data/catalog-summary.json data/owned-collection-gap-report.json assets/cards/bulk)
          EXISTING=()
          for p in "${CANDIDATES[@]}"; do [ -e "$p" ] && EXISTING+=("$p"); done
          if [ ${#EXISTING[@]} -eq 0 ] || [ -z "$(git status --porcelain -- "${EXISTING[@]}")" ]; then echo "Exact-front cache already current."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${EXISTING[@]}"
          git commit -m "Expand verified exact card fronts"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
