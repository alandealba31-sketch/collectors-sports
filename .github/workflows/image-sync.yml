name: Sync exact card fronts fast

on:
  push:
    branches: ["main"]
    paths:
      - "data/image-sync-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "collectors-data-sync"
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install structured sync dependencies
        run: python -m pip install --disable-pip-version-check mcp requests beautifulsoup4 pillow
      - name: Expand structured parallels and exact fronts
        run: python sync_mycardfolio_v4.py
      - name: Repair missing fronts from known card IDs
        env:
          MCF_DETAIL_IMAGE_MAX: "340"
          MCF_DETAIL_IMAGE_DELAY: "1.05"
          MCF_DETAIL_IMAGE_MAX_SECONDS: "1500"
        run: python tools/repair_mycardfolio_images.py
      - name: Audit image and owned-collection coverage
        run: |
          python tools/update_catalog_summary.py
          node tools/audit_loaded_catalog.mjs
          node tools/audit_owned_collection_gaps.mjs
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ['data/mycardfolio-sync-report.json','data/mycardfolio-detail-image-report.json','data/catalog-summary.json','data/owned-collection-gap-report.json']:
              p=Path(filename)
              if p.exists():
                  print('\n'+filename)
                  print(json.dumps(json.loads(p.read_text()),indent=2)[:40000])
          PY
      - name: Clean runtime config
        if: always()
        run: rm -f data/mycardfolio-runtime-products.json
      - name: Validate generated structured catalogs
        run: |
          node --check catalog-mycardfolio-expanded.js
          node --check catalog-images-mycardfolio.js
          python -m py_compile tools/repair_mycardfolio_images.py
      - name: Commit structured image and parallel gains
        run: |
          set -euo pipefail
          CANDIDATES=(
            catalog-mycardfolio-expanded.js catalog-images-mycardfolio.js
            data/mycardfolio-sync-state.json data/mycardfolio-sync-report.json
            data/mycardfolio-detail-image-state.json data/mycardfolio-detail-image-report.json
            data/catalog-summary.json data/owned-collection-gap-report.json
          )
          EXISTING=()
          for p in "${CANDIDATES[@]}"; do [ -e "$p" ] && EXISTING+=("$p"); done
          if [ ${#EXISTING[@]} -eq 0 ]; then echo "No structured outputs exist."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${EXISTING[@]}"
          if git diff --cached --quiet; then echo "Structured fronts and parallels are already current."; exit 0; fi
          git commit -m "Expand structured exact card fronts and parallels"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep 3
          done
          exit 1
